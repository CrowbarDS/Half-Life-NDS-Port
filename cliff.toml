# The release notes (git-cliff): the commits since the last tag, by their area.
# Only those with an "area: what" title: older ones say little ("commit", merges).
[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}
"""
footer = """

Thanks to NewGBAXL for streaming textures, smooth character animation and save versioning.
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
filter_commits = true
commit_parsers = [
    { message = "^(net|demo|child|dlp|guest):", group = "Multiplayer and Download Play" },
    { message = "^(gui|install|convert):", group = "Converter" },
    { message = "^(ui|menu|controls|settings|hud|text):", group = "Interface" },
    { message = "^(save|saves):", group = "Saves" },
    { message = "^(math|maths|hwmath|perf):", group = "Speed" },
    { message = "^(render|anim|world|sound|audio|dsp|shared|game|logic|items|weapons|tanks|monsters|models|bones|decals|holograms|targets):", group = "Game" },
    { message = "^(ci|build|test|tests|tools|hwtest|repo|docs|agents|version|release):", group = "Project" },
    # (Any other "area: what" title: listed rather than lost.)
    { message = "^[a-z0-9-]+:", group = "Other" },
]
tag_pattern = "v[0-9]*"
