# The release notes (git-cliff): the commits since the last tag, by their area.
# Only those with an "area: what" title: older ones say little ("commit", merges).
[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}
"""
footer = """

Thanks to NewGBAXL for streaming textures, smooth character animation and save versioning.
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
filter_commits = true
commit_parsers = [
    { message = "^(net|demo|child|dlp):", group = "Multiplayer and Download Play" },
    { message = "^(gui|install|convert):", group = "Converter" },
    { message = "^(ui|menu|controls):", group = "Interface" },
    { message = "^(render|anim|world|sound|audio|dsp|shared|game):", group = "Game" },
    { message = "^(ci|build|test|tools|repo|docs|agents|version):", group = "Project" },
]
tag_pattern = "v[0-9]*"
