# The relay's journal (LogNamespace=hlds-relay in hlds-relay.service): kept a
# week, and never more than 50 MB. What it holds: consoles coming and going,
# rooms, a line of counts a minute -- addresses cut to their first three
# numbers (or hashed: --log-ips), never a player's name.
#
# Installed as /etc/systemd/journald@hlds-relay.conf (install.sh does it).
# Read with: journalctl --namespace=hlds-relay

[Journal]
Storage=persistent
MaxRetentionSec=7day
SystemMaxUse=50M
RuntimeMaxUse=10M
