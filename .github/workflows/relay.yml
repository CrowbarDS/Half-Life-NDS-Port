# The relay for online play (tools/relay), built and tested on both machines it
# is run on: x86_64 and arm64. The tests run with AddressSanitizer and
# UndefinedBehaviorSanitizer, so a bad read of a datagram fails the run. And
# the relay a server runs, for each: one static program (any Linux runs it,
# whatever its C library), tried on two full rooms before it is kept --
# bundle.yml puts them in the release, with their SHA-256.
name: Relay

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install what it needs
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Build with the sanitizers
        run: |
          cmake -S tools/relay -B build/relay -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHLDS_RELAY_SANITIZE=ON
          cmake --build build/relay

      - name: Test
        run: ctest --test-dir build/relay --output-on-failure

  binary:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    name: binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install what it needs
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build file

      - name: Build the static relay
        run: |
          cmake -S tools/relay -B build/relay -G Ninja -DCMAKE_BUILD_TYPE=Release -DHLDS_BUILD_TESTS=OFF \
            "-DCMAKE_EXE_LINKER_FLAGS=-static -s"
          cmake --build build/relay

      - name: Check it
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          file build/relay/hlds-relay | tee file.txt
          grep -q 'statically linked' file.txt
          case "$ARCH" in
            x86_64) grep -q 'x86-64' file.txt ;;
            aarch64) grep -q 'ARM aarch64' file.txt ;;
          esac
          # (Two full rooms, one sending a map, through this very program.)
          build/relay/hlds-relay-loadtest --spawn build/relay/hlds-relay --rooms 2 --players 8 --seconds 3 --map --most-loss 2

      - name: Name it for the release
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p out
          cp build/relay/hlds-relay "out/hlds-relay-linux-$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: out/*
