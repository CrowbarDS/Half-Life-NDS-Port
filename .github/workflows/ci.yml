# On every push to main, and for pull requests: everything is built and tested,
# and what a release would hold is kept as artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  rom:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/rom.yml

  converter:
    needs: rom
    permissions:
      contents: read
    uses: ./.github/workflows/converter.yml

  relay:
    permissions:
      contents: read
    uses: ./.github/workflows/relay.yml

  bundle:
    needs: [rom, converter, relay]
    permissions:
      contents: read
    uses: ./.github/workflows/bundle.yml
    with:
      version: ${{ github.sha }}
