# The ROMs, built in the toolchain image, and the host suites run there.
name: ROM

on:
  workflow_call:

permissions: {}

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/toolchain-image.yml

  rom:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      HLDS_JOBS: 4
      PYTHONPATH: ${{ github.workspace }}/architectds_nea_mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version comes from the tags

      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the ROMs
        run: ./make.sh

      - name: Check what the hot code and the library are made of
        run: tools/arm9-report.sh --check

      - name: Build the host suites
        run: |
          cmake -S tools/hlds-convert -B build/convert -DHLDS_BUILD_GUI=OFF
          cmake --build build/convert -j4

      - name: Run the host suites
        run: ctest --test-dir build/convert --output-on-failure

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rom
          if-no-files-found: error
          path: |
            half-life-nds-port.nds
            child/out/hl-child-twl.nds
            build/hl/hl.dsl

      # The same ROMs for whoever works on the port, built after the
      # release's are taken: a development build (debug_start.txt and the
      # readout: tools/emu/play.sh's EMU_START), and one with the frame-time
      # readout besides (HLDS_PROFILE). Each is copied out as it is made --
      # every variant writes the same files -- with its program's symbols,
      # to read an address by.
      - name: Build the development ROMs
        run: |
          HLDS_DEV=1 ./make.sh
          mkdir -p dist/dev/child
          cp half-life-nds-port.nds build/arm9/arm9.elf build/hl/hl.dsl dist/dev/
          cp child/out/hl-child-twl.nds dist/dev/child/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rom-dev
          if-no-files-found: error
          path: dist/dev/

      - name: Build the profiling ROMs
        run: |
          HLDS_DEV=1 HLDS_PROFILE=1 ./make.sh
          mkdir -p dist/profile/child
          cp half-life-nds-port.nds build/arm9/arm9.elf build/hl/hl.dsl dist/profile/
          cp child/out/hl-child-twl.nds dist/profile/child/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rom-profile
          if-no-files-found: error
          path: dist/profile/
