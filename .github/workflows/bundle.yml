# Everything a release has, in one artifact: the converter's packages (each
# with the console's ROM built in, made for the console the player chooses),
# the relay for a server (x86_64 and aarch64), the checksums and the notes. Called after every other build, so that the
# release is only ever made from builds that all passed.
name: Bundle

on:
  workflow_call:
    inputs:
      version:
        description: The version the files are named for
        type: string
        required: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Gather the files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # (No ROM of its own: the converter has it built in, and makes it for
          # the console the card is for -- put-rom writes it alone.)
          mkdir -p release
          for f in artifacts/converter-*/*; do
            name="$(basename "$f")"
            cp "$f" "release/${name/hlds-convert/hlds-convert-$VERSION}"
          done
          # (The relay keeps its name: tools/relay/deploy/install.sh fetches it
          # by it, and checks it against SHA256SUMS.txt.)
          cp artifacts/relay-linux-*/hlds-relay-linux-* release/
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          ls -la release

      - name: Write the notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          path: |
            release/*
            release-notes.md
